services:
  db:
    image: postgres:15
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - baza_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: lms_redis
    restart: always

  app:
    build: .
    container_name: lms_app
    restart: always

    env_file:
      - .env

    ports:
      - "9191:9191"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - ./src/uploads:/app/src/uploads

    command: >
      sh -c "
        npx prisma migrate deploy &&
        npm run start:prod
      "

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  baza_data:
